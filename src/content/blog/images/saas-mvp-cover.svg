  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g>
    <rect x="900" y="150" width="230" height="80" rx="14" fill="#ffffff" fill-opacity="0.10" stroke="#86efac" stroke-opacity="0.6" stroke-width="2"/>
