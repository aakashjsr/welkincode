<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="A request flows from the web app to the database, the Redis broker, a worker and an external API. Four numbered points mark where it can fail.">
  <rect width="960" height="400" fill="#f8fafc"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" fill="#0f172a">
    <g fill="#e2e8f0" stroke="#cbd5e1">
      <rect x="25" y="125" width="150" height="70" rx="12"/>
      <rect x="215" y="125" width="150" height="70" rx="12"/>
      <rect x="405" y="125" width="150" height="70" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
      <rect x="595" y="125" width="150" height="70" rx="12"/>
      <rect x="785" y="125" width="150" height="70" rx="12"/>
    </g>
    <g font-size="17" font-weight="600" text-anchor="middle">
      <text x="100" y="166">Web app</text>
      <text x="290" y="166">Database</text>
      <text x="480" y="166">Redis broker</text>
      <text x="670" y="166">Worker</text>
      <text x="860" y="166">External API</text>
    </g>
    <g stroke="#64748b" stroke-width="2" fill="none">
      <line x1="177" y1="160" x2="213" y2="160" marker-end="url(#arr)"/>
      <line x1="367" y1="160" x2="403" y2="160" marker-end="url(#arr)"/>
      <line x1="557" y1="160" x2="593" y2="160" marker-end="url(#arr)"/>
      <line x1="747" y1="160" x2="783" y2="160" marker-end="url(#arr)"/>
    </g>
    <g fill="#b91c1c">
      <circle cx="385" cy="95" r="15"/>
      <circle cx="480" cy="95" r="15"/>
      <circle cx="670" cy="95" r="15"/>
      <circle cx="765" cy="95" r="15"/>
    </g>
    <g fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">
      <text x="385" y="101">1</text>
      <text x="480" y="101">2</text>
      <text x="670" y="101">3</text>
      <text x="765" y="101">4</text>
    </g>
    <g font-size="17">
      <text x="40" y="255"><tspan font-weight="700" fill="#b91c1c">1</tspan>  Task published before the transaction commits</text>
      <text x="40" y="290"><tspan font-weight="700" fill="#b91c1c">2</tspan>  Redis restarts or evicts keys, messages vanish</text>
      <text x="40" y="325"><tspan font-weight="700" fill="#b91c1c">3</tspan>  Worker is killed halfway through the task</text>
      <text x="40" y="360"><tspan font-weight="700" fill="#b91c1c">4</tspan>  Call succeeds but the answer never arrives, so the retry repeats it</text>
    </g>
  </g>
</svg>
